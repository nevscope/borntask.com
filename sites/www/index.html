<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BornTask - From idea to done, without the drag</title>
    <meta
      name="description"
      content="BornTask is a work tracker for ideas, bugs, improvements and features. Sign in at app.borntask.com."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/borntask-logo-120.png" />
    <link rel="canonical" href="https://borntask.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Sora:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand: #178a5c;
        --brand-strong: #0f6b46;
        --brand-on: #e4f3eb;
        --brand-on-muted: #d2ebdd;
        --ink: #121417;
        --muted: #5b6157;
        --faint: #8a9086;
        --surface: #ffffff;
        --ui: "DM Sans", system-ui, sans-serif;
        --display: "Sora", "DM Sans", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font-family: var(--ui);
        color: var(--surface);
        background: var(--brand);
      }
      .page {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: 48px 56px 40px;
        max-width: 880px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--surface);
        text-decoration: none;
      }
      .wordmark {
        font-family: var(--display);
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.035em;
      }
      .brand svg {
        display: block;
        flex-shrink: 0;
        border-radius: 10px;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.28);
      }
      .app-logo {
        display: block;
        width: 120px;
        height: 120px;
        border-radius: 28px;
        box-shadow: 0 12px 28px rgba(15, 107, 70, 0.28);
      }
      .hero {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 28px;
        padding: 48px 0;
      }
      h1 {
        margin: 0;
        font-family: var(--display);
        font-size: clamp(32px, 5vw, 44px);
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.1;
      }
      .lede {
        margin: 0;
        max-width: 480px;
        font-size: 16px;
        line-height: 1.5;
        color: var(--brand-on);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 48px;
        padding: 0 22px;
        border-radius: 10px;
        background: var(--surface);
        color: var(--brand-strong);
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
      }
      .btn:hover { background: var(--brand-on); }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        font-size: 14px;
        font-weight: 500;
      }
      .links a {
        color: var(--brand-on);
        text-decoration: none;
      }
      .links a:hover { color: var(--surface); }
      footer {
        font-size: 13px;
        color: var(--brand-on-muted);
      }
      @media (max-width: 640px) {
        .page { padding: 32px 24px 28px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <a class="brand" href="https://borntask.com/">
        <svg width="32" height="32" viewBox="0 0 48 48" aria-hidden="true">
          <rect width="48" height="48" rx="13.5" fill="#FFFFFF" />
          <circle cx="8.75" cy="25.6" r="1.9" fill="#178A5C" fill-opacity="0.55" />
          <circle cx="16.05" cy="25.6" r="2.8" fill="#178A5C" fill-opacity="0.8" />
          <path d="M23.85 25.6 L28.25 30 L38.75 18" fill="none" stroke="#178A5C" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="wordmark">borntask</span>
      </a>
      <main class="hero">
        <svg class="app-logo" width="120" height="120" viewBox="0 0 48 48" role="img" aria-label="BornTask">
          <rect width="48" height="48" rx="13.5" fill="#FFFFFF" />
          <circle cx="8.75" cy="25.6" r="1.9" fill="#178A5C" fill-opacity="0.55" />
          <circle cx="16.05" cy="25.6" r="2.8" fill="#178A5C" fill-opacity="0.8" />
          <path d="M23.85 25.6 L28.25 30 L38.75 18" fill="none" stroke="#178A5C" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <h1>From idea to done,<br />without the drag.</h1>
        <p class="lede">
          Ideas, bugs, improvements and features in one fast list and board, moving through the workflow your team agreed.
        </p>
        <div class="actions">
          <a class="btn" href="https://app.borntask.com/">Open BornTask</a>
        </div>
        <nav class="links" aria-label="Legal">
          <a href="https://borntask.com/privacy/">Privacy notice</a>
          <a href="https://borntask.com/terms/">Terms of use</a>
        </nav>
      </main>
      <footer>BornTask</footer>
    </div>
  </body>
</html>
