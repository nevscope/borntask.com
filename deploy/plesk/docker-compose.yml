# Canonical Plesk Compose for BornTask.
# Host secrets: /var/www/vhosts/borntask.com/docker/borntask/.env

name: borntask

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-borntask}
      MYSQL_USER: ${MYSQL_USER:-borntask}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - borntask_mysql:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - borntask_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "3010"
      DATABASE_URL: mysql://${MYSQL_USER:-borntask}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-borntask}
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: ${PUBLIC_URL:-https://app.borntask.com}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://app.borntask.com/api}
      SESSION_SECRET: ${SESSION_SECRET}
      ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-https://app.borntask.com}
      BLOB_ROOT: ${BLOB_ROOT:-/data/blobs}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GOOGLE_CHAT_APP_CLIENT_ID: ${GOOGLE_CHAT_APP_CLIENT_ID:-}
      GOOGLE_CHAT_APP_CLIENT_SECRET: ${GOOGLE_CHAT_APP_CLIENT_SECRET:-}
      GOOGLE_CHAT_APP_VERIFICATION_TOKEN: ${GOOGLE_CHAT_APP_VERIFICATION_TOKEN:-}
      GOOGLE_CHAT_APP_SERVICE_ACCOUNT_JSON: ${GOOGLE_CHAT_APP_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_CHAT_APP_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_CHAT_APP_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_CHAT_APP_SERVICE_ACCOUNT_PRIVATE_KEY: ${GOOGLE_CHAT_APP_SERVICE_ACCOUNT_PRIVATE_KEY:-}
    ports:
      - "127.0.0.1:3010:3010"
    volumes:
      - borntask_blobs:/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATABASE_URL: mysql://${MYSQL_USER:-borntask}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-borntask}
      PUBLIC_URL: ${PUBLIC_URL:-https://app.borntask.com}
      SESSION_SECRET: ${SESSION_SECRET}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      BLOB_ROOT: ${BLOB_ROOT:-/data/blobs}
      API_INTERNAL_URL: http://api:3010
      GOOGLE_CHAT_APP_CLIENT_ID: ${GOOGLE_CHAT_APP_CLIENT_ID:-}
      GOOGLE_CHAT_APP_CLIENT_SECRET: ${GOOGLE_CHAT_APP_CLIENT_SECRET:-}
      GOOGLE_CHAT_APP_VERIFICATION_TOKEN: ${GOOGLE_CHAT_APP_VERIFICATION_TOKEN:-}
      GOOGLE_CHAT_APP_SERVICE_ACCOUNT_JSON: ${GOOGLE_CHAT_APP_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_CHAT_APP_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_CHAT_APP_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_CHAT_APP_SERVICE_ACCOUNT_PRIVATE_KEY: ${GOOGLE_CHAT_APP_SERVICE_ACCOUNT_PRIVATE_KEY:-}
    volumes:
      - borntask_blobs:/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mcp:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: apps/mcp/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MCP_HOST: 0.0.0.0
      MCP_PORT: "3011"
      PUBLIC_URL: ${PUBLIC_URL:-https://app.borntask.com}
      API_PUBLIC_URL: http://api:3010
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-https://app.borntask.com}
    ports:
      - "127.0.0.1:3011:3011"
    depends_on:
      api:
        condition: service_started

volumes:
  borntask_mysql:
  borntask_redis:
  borntask_blobs:
