# Plesk: app.borntask.com → Apache & nginx Settings → Additional nginx directives
# Paste the location block only (no if / rewrite; Plesk rejects those here).
# Host file:
#   /var/www/vhosts/system/app.borntask.com/conf/vhost_nginx.conf
# Then: plesk sbin httpdmng --reconfigure-domain app.borntask.com
#
# Proxies /api to the BornTask API on 127.0.0.1:3010 (strip /api).
# error_page sends SPA routes (e.g. /create-workspace after Google) to index.html.
# Do not bind kerd ports 3000 / 3307 / 6380.

error_page 404 =200 /index.html;

location ^~ /api/ {
    proxy_pass http://127.0.0.1:3010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    client_max_body_size 25m;
}

location ^~ /mcp {
    proxy_pass http://127.0.0.1:3011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $content_type;
    proxy_pass_request_headers on;
}

location ^~ /.well-known/oauth-protected-resource {
    proxy_pass http://127.0.0.1:3011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /.well-known/oauth-authorization-server {
    proxy_pass http://127.0.0.1:3011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /oauth/authorize {
    proxy_pass http://127.0.0.1:3011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /oauth/register {
    proxy_pass http://127.0.0.1:3011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Content-Type $content_type;
}

location = /oauth/token {
    proxy_pass http://127.0.0.1:3011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Content-Type $content_type;
}

# Google/Microsoft callback when the client uses https://app.borntask.com/auth/... (same path as localhost:3010).
location ^~ /auth/ {
    proxy_pass http://127.0.0.1:3010/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
}
