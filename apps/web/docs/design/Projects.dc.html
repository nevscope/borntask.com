<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BornTask – Projects</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Sora:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F6B46}a:hover{color:#0B5236}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-wrap: wrap; background: #F7F8F6; font-family: 'DM Sans', sans-serif; font-size: 14px; color: #121417;">
  <nav aria-label="Main" style="flex: 1 1 232px; max-width: 272px; box-sizing: border-box; padding: 16px 12px; background: #FFFFFF; border-right: 1px solid #E8EBE6; display: flex; flex-direction: column; gap: 2px;">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 10px 14px;">
      <svg width="26" height="26" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="13.5" fill="#178A5C"></rect><circle cx="8.75" cy="25.6" r="1.9" fill="#FFFFFF" fill-opacity="0.6"></circle><circle cx="16.05" cy="25.6" r="2.8" fill="#FFFFFF" fill-opacity="0.85"></circle><path d="M23.85 25.6 L28.25 30 L38.75 18" fill="none" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 600; letter-spacing: -0.035em;">borntask</span>
    </div>
    <button type="button" style="display: flex; align-items: center; justify-content: space-between; height: 36px; margin: 0 0 10px; padding: 0 10px; border: 1px solid #E8EBE6; border-radius: 8px; background: #FAFBF9; font: inherit; font-size: 13px; color: #3A3F38; cursor: pointer;">Scope Cloud Solutions<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; color: #3A3F38; text-decoration: none; font-size: 13.5px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8.5 12.5l2.5 2.5 4.5-5"></path></svg><span style="flex: 1;">My tasks</span><span style="font-size: 12px; color: #5B6157;">7</span></a>
    <a href="Search.dc.html" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; color: #3A3F38; text-decoration: none; font-size: 13.5px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Search</a>
    <a href="Projects.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; background: #E9F5EF; color: #0F6B46; font-weight: 600; text-decoration: none; font-size: 13.5px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Projects</a>
    <div style="padding: 18px 10px 6px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5B6157;">Favourites</div>
    <a href="ListView.dc.html" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: #3A3F38; text-decoration: none; font-size: 13.5px;"><span style="width: 8px; height: 8px; border-radius: 3px; background: #2F6FDB;"></span>Website relaunch</a>
    <a href="ListView.dc.html" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: #3A3F38; text-decoration: none; font-size: 13.5px;"><span style="width: 8px; height: 8px; border-radius: 3px; background: #E0731F;"></span>Mobile app</a>
    <a href="ListView.dc.html" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: #3A3F38; text-decoration: none; font-size: 13.5px;"><span style="width: 8px; height: 8px; border-radius: 3px; background: #8E59D9;"></span>Client onboarding</a>
    <div style="flex: 1; min-height: 24px;"></div>
    <a href="AdminPeople.dc.html" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; color: #3A3F38; text-decoration: none; font-size: 13.5px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>Settings</a>
  </nav>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 28px; background: #FFFFFF; border-bottom: 1px solid #E8EBE6;">
      <label style="flex: 1 1 280px; max-width: 520px; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border: 1px solid #E8EBE6; border-radius: 8px; background: #FAFBF9; color: #5B6157;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input type="search" aria-label="Search tasks" placeholder="Search tasks or jump to WEB-142" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 13.5px; color: #121417; outline: none;"><kbd style="font-family: inherit; font-size: 11px; padding: 1px 6px; border: 1px solid #DDE1DA; border-radius: 5px; background: #FFFFFF; color: #5B6157;">/</kbd></label>
      <div style="flex: 1;"></div>
      <a href="QuickAdd.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 8px; background: #178A5C; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 13.5px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New task<kbd style="font-family: inherit; font-size: 11px; padding: 0 5px; border-radius: 4px; background: rgba(255,255,255,0.2); color: #FFFFFF;">Q</kbd></a>
      <span aria-label="Signed in as Scope" style="width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #121417; color: #FFFFFF; font-size: 12px; font-weight: 600;">SC</span>
    </header>
    <main style="padding: 28px 28px 56px;">
      <div style="max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
          <h1 style="flex: 1 1 200px; margin: 0; font-family: 'Sora', sans-serif; font-size: 26px; font-weight: 600; letter-spacing: -0.03em;">Projects</h1>
          <div role="group" aria-label="Show" style="display: flex; padding: 3px; border: 1px solid #E8EBE6; border-radius: 9px; background: #FFFFFF;">
            <button type="button" aria-pressed="true" style="height: 30px; padding: 0 12px; border: 0; border-radius: 6px; background: #121417; color: #FFFFFF; font: inherit; font-size: 13px; cursor: pointer;">Active</button>
            <button type="button" aria-pressed="false" style="height: 30px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: #3A3F38; font: inherit; font-size: 13px; cursor: pointer;">Archived</button>
          </div>
          <a href="Import.dc.html" style="display: inline-flex; align-items: center; height: 38px; padding: 0 14px; border: 1px solid #E8EBE6; border-radius: 8px; background: #FFFFFF; color: #3A3F38; text-decoration: none; font-size: 13.5px;">Import from Asana</a>
          <a href="CreateProject.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 8px; background: #121417; color: #FFFFFF; text-decoration: none; font-size: 13.5px; font-weight: 600;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New project</a>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;">
          <sc-for list="{{projects}}" as="p" hint-placeholder-count="6">
            <a href="ListView.dc.html" style="display: flex; flex-direction: column; gap: 14px; padding: 18px; background: #FFFFFF; border: 1px solid #E8EBE6; border-radius: 12px; color: #121417; text-decoration: none;">
              <span style="display: flex; align-items: center; gap: 10px;"><span style="width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: {{p.tint}}; color: {{p.ink}}; font-size: 11px; font-weight: 600;">{{p.key}}</span><span style="flex: 1; min-width: 0;"><span style="display: block; font-weight: 600; font-size: 15px;">{{p.name}}</span><span style="display: block; font-size: 12.5px; color: #5B6157;">Lead: {{p.lead}}</span></span><span style="font-size: 12px; color: #5B6157;">{{p.guests}}</span></span>
              <span style="display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: #F1F2EF; gap: 2px;"><span style="width: {{p.w1}}; background: #AEB4AA;"></span><span style="width: {{p.w2}}; background: #2F6FDB;"></span><span style="width: {{p.w3}}; background: #E0731F;"></span><span style="width: {{p.w4}}; background: #178A5C;"></span></span>
              <span style="display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: #3A3F38;"><span><strong>{{p.open}}</strong> open</span><span><strong>{{p.review}}</strong> in review</span><span><strong>{{p.done}}</strong> deployed</span><span style="margin-left: auto; color: #5B6157;">{{p.updated}}</span></span>
            </a>
          </sc-for>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 16px; font-size: 12.5px; color: #5B6157;">
          <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 6px; border-radius: 2px; background: #AEB4AA;"></span>Backlog</span>
          <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 6px; border-radius: 2px; background: #2F6FDB;"></span>Active</span>
          <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 6px; border-radius: 2px; background: #E0731F;"></span>Review</span>
          <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 6px; border-radius: 2px; background: #178A5C;"></span>Done</span>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      { key: 'WEB', name: 'Website relaunch', lead: 'Luke Camilleri', tint: '#EAF1FD', ink: '#1F55B8', c: [4, 3, 2, 3], updated: '2 min ago', guests: '' },
      { key: 'MOB', name: 'Mobile app', lead: 'Karl Farrugia', tint: '#FFF0E5', ink: '#A04A0C', c: [7, 4, 3, 9], updated: '1 h ago', guests: '' },
      { key: 'CLI', name: 'Client onboarding', lead: 'Daniela Vella', tint: '#F1EEFC', ink: '#5B3FC4', c: [2, 3, 1, 5], updated: 'Yesterday', guests: '' },
      { key: 'HLP', name: 'Harbour Logistics portal', lead: 'Maria Borg', tint: '#E9F5EF', ink: '#0F6B46', c: [5, 2, 2, 1], updated: '3 h ago', guests: '2 guests' },
      { key: 'RPT', name: 'Reporting dashboards', lead: 'Maria Borg', tint: '#FDF3E2', ink: '#8A5A0B', c: [6, 3, 2, 12], updated: 'Fri', guests: '' },
      { key: 'OPS', name: 'Internal ops', lead: 'Scope', tint: '#F1F2EF', ink: '#3A3F38', c: [1, 2, 1, 14], updated: 'Thu', guests: '' }
    ];
    const pct = (n, t) => (Math.round((n / t) * 1000) / 10) + '%';
    return { projects: list.map((p) => { const t = p.c[0] + p.c[1] + p.c[2] + p.c[3]; return { ...p, w1: pct(p.c[0], t), w2: pct(p.c[1], t), w3: pct(p.c[2], t), w4: pct(p.c[3], t), open: p.c[0] + p.c[1] + p.c[2], review: p.c[2], done: p.c[3] }; }) };
  }
}
</script>
</body>
</html>
