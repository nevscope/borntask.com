  </nav>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 28px; background: #FFFFFF; border-bottom: 1px solid #E8EBE6;">
      <label style="flex: 1 1 280px; max-width: 520px; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border: 1px solid #E8EBE6; border-radius: 8px; background: #FAFBF9; color: #5B6157;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input type="search" aria-label="Search tasks" placeholder="Search tasks or jump to WEB-142" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 13.5px; color: #121417; outline: none;"><kbd style="font-family: inherit; font-size: 11px; padding: 1px 6px; border: 1px solid #DDE1DA; border-radius: 5px; background: #FFFFFF; color: #5B6157;">/</kbd></label>
      <div style="flex: 1;"></div>
      <a href="QuickAdd.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 8px; background: #178A5C; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 13.5px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New task<kbd style="font-family: inherit; font-size: 11px; padding: 0 5px; border-radius: 4px; background: rgba(255,255,255,0.2); color: #FFFFFF;">Q</kbd></a>

      <span aria-label="Signed in as Scope" style="width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #121417; color: #FFFFFF; font-size: 12px; font-weight: 600;">SC</span>
    </header>
    <main style="padding: 32px 28px 56px;">
      <div style="max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px;">
        <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px;">
          <div>
            <h1 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 26px; font-weight: 600; letter-spacing: -0.03em;">My tasks</h1>
            <p style="margin: 6px 0 0; color: #5B6157; font-size: 13.5px;">Sunday 11 October · 7 open across 4 projects</p>
          </div>
          <div role="group" aria-label="Show" style="display: flex; padding: 3px; border: 1px solid #E8EBE6; border-radius: 9px; background: #FFFFFF;">
            <button type="button" aria-pressed="true" style="height: 30px; padding: 0 12px; border: 0; border-radius: 6px; background: #121417; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">Assigned to me</button>
            <button type="button" aria-pressed="false" style="height: 30px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: #3A3F38; font: inherit; font-size: 13px; cursor: pointer;">Created by me</button>
            <button type="button" aria-pressed="false" style="height: 30px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: #3A3F38; font: inherit; font-size: 13px; cursor: pointer;">Watching</button>
          </div>
        </div>
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
          <section style="background: #FFFFFF; border: 1px solid #E8EBE6; border-radius: 12px; overflow: hidden;">
            <div style="display: flex; align-items: center; gap: 8px; padding: 12px 16px; font-size: 13px; font-weight: 600; color: {{g.color}};">{{g.name}}<span style="font-weight: 500; color: #5B6157;">{{g.count}}</span></div>
            <sc-for list="{{g.tasks}}" as="t" hint-placeholder-count="2">
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; min-height: 46px; padding: 4px 16px 4px 8px; border-top: 1px solid #EEF0EC;">
                <button type="button" aria-label="Mark {{t.key}} done" style="width: 32px; height: 32px; display: grid; place-items: center; border: 0; background: transparent; padding: 0; cursor: pointer;"><span style="width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #AEB4AA;"></span></button>
                <span style="width: 58px; font-size: 12.5px; color: #5B6157; font-variant-numeric: tabular-nums;">{{t.key}}</span>
                <a href="TaskDetail.dc.html" style="flex: 1 1 240px; min-width: 0; color: #121417; text-decoration: none; font-weight: 500;">{{t.title}}</a>
                <span style="font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 6px; background: {{t.typeBg}}; color: {{t.typeFg}};">{{t.type}}</span>
                <span style="display: inline-flex; align-items: center; gap: 6px; width: 140px; font-size: 12.5px; color: #3A3F38;"><span style="width: 7px; height: 7px; border-radius: 2px; background: {{t.prDot}};"></span>{{t.project}}</span>
                <span style="display: inline-flex; align-items: center; gap: 6px; width: 140px; font-size: 12.5px;"><span style="display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; background: {{t.stBg}}; color: {{t.stFg}}; font-weight: 500;"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{t.stDot}};"></span>{{t.status}}</span></span>
                <span style="width: 84px; text-align: right; font-size: 12.5px; color: {{t.dueColor}}; font-weight: {{t.dueWeight}};">{{t.due}}</span>
              </div>
            </sc-for>
          </section>
        </sc-for>
        <a href="QuickAdd.dc.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border: 1px dashed #CDD2C9; border-radius: 12px; color: #5B6157; text-decoration: none; font-size: 13.5px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a task<span style="margin-left: auto; font-size: 12px;">or press <kbd style="font-family: inherit; font-size: 11px; padding: 1px 6px; border: 1px solid #DDE1DA; border-radius: 5px; background: #FFFFFF; color: #5B6157;">Q</kbd> anywhere</span></a>

    </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const TY = {Idea:['#F1EEFC','#5B3FC4'],Bug:['#FDECEC','#B42323'],Improvement:['#FDF3E2','#8A5A0B'],Feature:['#EAF1FD','#1F55B8']};
    const ST = {'Idea':['#F1F2EF','#3A3F38','#8A9086'],'Approved':['#EEF0FB','#3B49B8','#5865D6'],'WIP':['#EAF1FD','#1F55B8','#2F6FDB'],'Ready for testing':['#FDF3E2','#8A5A0B','#C98A1A'],'Testing':['#FFF0E5','#A04A0C','#E0731F'],'Deployed':['#E9F5EF','#0F6B46','#178A5C'],'On hold':['#F1F2EF','#5B6157','#8A9086']};
    const PR = {'Website relaunch':'#2F6FDB','Mobile app':'#E0731F','Client onboarding':'#8E59D9','Internal ops':'#5B6157'};
    const d = (t) => ({ ...t, typeBg: TY[t.type][0], typeFg: TY[t.type][1], stBg: ST[t.status][0], stFg: ST[t.status][1], stDot: ST[t.status][2], prDot: PR[t.project], dueColor: t.late ? '#B42323' : (t.today ? '#0F6B46' : '#5B6157'), dueWeight: (t.late || t.today) ? 600 : 400 });
    const groups = [
      { name: 'Overdue', color: '#B42323', tasks: [
        { key: 'OPS-31', title: 'Renew SSL certificates for client portals', type: 'Improvement', project: 'Internal ops', status: 'WIP', due: 'Fri 9 Oct', late: true } ] },
      { name: 'Today', color: '#0F6B46', tasks: [
        { key: 'WEB-142', title: 'Checkout fails on Safari 17', type: 'Bug', project: 'Website relaunch', status: 'Testing', due: 'Today', today: true },
        { key: 'MOB-27', title: 'Review push notification copy', type: 'Improvement', project: 'Mobile app', status: 'Ready for testing', due: 'Today', today: true } ] },
      { name: 'This week', color: '#121417', tasks: [
        { key: 'CLI-12', title: 'Welcome email sequence for new clients', type: 'Feature', project: 'Client onboarding', status: 'WIP', due: 'Wed 14 Oct' },
        { key: 'WEB-151', title: 'Hero copy for the autumn campaign', type: 'Improvement', project: 'Website relaunch', status: 'Approved', due: 'Fri 16 Oct' },
        { key: 'WEB-139', title: 'Add Apple Pay to checkout', type: 'Feature', project: 'Website relaunch', status: 'WIP', due: 'Sun 18 Oct' } ] },
      { name: 'Later', color: '#121417', tasks: [
        { key: 'MOB-30', title: 'Offline mode for the task list', type: 'Idea', project: 'Mobile app', status: 'Idea', due: 'No date' } ] }
    ];
    return { groups: groups.map((g) => ({ ...g, count: g.tasks.length, tasks: g.tasks.map(d) })) };
  }
}
</script>
